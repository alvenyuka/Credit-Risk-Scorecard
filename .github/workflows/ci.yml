name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      # The Home Credit dataset is 2.5 GB and gitignored, so CI cannot use it.
      # Every test in tests/ runs on small synthetic data generated with a fixed
      # seed: the from-scratch statistics against sklearn and scipy, the WoE
      # binning, the scorecard arithmetic and prior correction, the feature
      # screening gates, the fair-lending checks and the approval-policy table.
      # The full pipeline run against the real data is a local step
      # (python src/run_pipeline.py) and is what writes outputs/results.json.
      # requirements-test.txt carries the same pins as requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -q
